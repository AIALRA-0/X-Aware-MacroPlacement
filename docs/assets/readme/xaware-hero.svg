<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">X-Aware MacroPlacement project banner</title>
  <desc id="desc">A dark technical banner showing a macro placement grid, thermal contours, and the analysis pipeline</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102743"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="heat" cx="42%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.98"/>
      <stop offset="0.28" stop-color="#f59e0b" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#7dd3fc" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#background)"/>
  <circle cx="130" cy="82" r="210" fill="#0ea5e9" opacity="0.09"/>
  <circle cx="1330" cy="510" r="260" fill="#22c55e" opacity="0.07"/>
  <g transform="translate(84 78)">
    <rect width="432" height="404" rx="28" fill="#081827" stroke="#38bdf8" stroke-opacity="0.36"/>
    <rect x="26" y="26" width="380" height="352" rx="18" fill="url(#grid)" stroke="#7dd3fc" stroke-opacity="0.22"/>
    <ellipse cx="142" cy="202" rx="124" ry="164" fill="url(#heat)" filter="url(#glow)"/>
    <g fill="#dbeafe" fill-opacity="0.88" stroke="#38bdf8" stroke-width="2">
      <rect x="66" y="77" width="74" height="45" rx="8"/>
      <rect x="165" y="62" width="98" height="67" rx="8"/>
      <rect x="290" y="89" width="70" height="45" rx="8"/>
      <rect x="77" y="161" width="112" height="63" rx="8"/>
      <rect x="217" y="166" width="68" height="96" rx="8"/>
      <rect x="311" y="177" width="54" height="70" rx="8"/>
      <rect x="57" y="273" width="70" height="61" rx="8"/>
      <rect x="156" y="286" width="115" height="43" rx="8"/>
      <rect x="303" y="282" width="68" height="55" rx="8"/>
    </g>
    <g fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      <text x="103" y="105">M1</text><text x="214" y="101">M2</text><text x="325" y="118">M3</text>
      <text x="133" y="199">M4</text><text x="251" y="219">M5</text><text x="338" y="218">M6</text>
      <text x="92" y="310">M7</text><text x="214" y="313">M8</text><text x="337" y="315">M9</text>
    </g>
  </g>
  <g transform="translate(590 91)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="56" fill="#f8fafc" font-size="55" font-weight="800">X-Aware MacroPlacement</text>
    <text x="2" y="102" fill="#bae6fd" font-size="23">Macro layout → synthetic power → relative thermal field → gradient risk</text>
    <rect x="2" y="137" width="682" height="4" rx="2" fill="url(#accent)"/>
    <g transform="translate(2 183)">
      <g>
        <rect width="148" height="74" rx="16" fill="#0f2942" stroke="#38bdf8"/>
        <text x="74" y="31" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">PLC / CSV</text>
        <text x="74" y="53" text-anchor="middle" fill="#7dd3fc" font-size="13">placement input</text>
      </g>
      <path d="M157 37 H203" stroke="#7dd3fc" stroke-width="3"/><path d="M196 30 L207 37 196 44" fill="none" stroke="#7dd3fc" stroke-width="3"/>
      <g transform="translate(215)">
        <rect width="148" height="74" rx="16" fill="#0e2e32" stroke="#34d399"/>
        <text x="74" y="31" text-anchor="middle" fill="#d1fae5" font-size="17" font-weight="700">Power grid</text>
        <text x="74" y="53" text-anchor="middle" fill="#6ee7b7" font-size="13">seeded synthesis</text>
      </g>
      <path d="M372 37 H418" stroke="#6ee7b7" stroke-width="3"/><path d="M411 30 L422 37 411 44" fill="none" stroke="#6ee7b7" stroke-width="3"/>
      <g transform="translate(430)">
        <rect width="148" height="74" rx="16" fill="#342612" stroke="#fbbf24"/>
        <text x="74" y="31" text-anchor="middle" fill="#fef3c7" font-size="17" font-weight="700">Heatmaps</text>
        <text x="74" y="53" text-anchor="middle" fill="#fde68a" font-size="13">T and ||∇T||</text>
      </g>
    </g>
    <g transform="translate(2 299)" font-size="16">
      <rect width="674" height="89" rx="18" fill="#071827" stroke="#94a3b8" stroke-opacity="0.28"/>
      <circle cx="34" cy="31" r="7" fill="#38bdf8"/><text x="54" y="37" fill="#cbd5e1">Deterministic NumPy/SciPy analysis core</text>
      <circle cx="34" cy="62" r="7" fill="#34d399"/><text x="54" y="68" fill="#cbd5e1">Command-line and Streamlit interfaces</text>
      <text x="642" y="54" text-anchor="end" fill="#fbbf24" font-size="40" font-weight="800">128²</text>
    </g>
  </g>
</svg>
